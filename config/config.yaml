# ---------------------------------------------------------------------------
# autogram configuration. Non-secret only. Env vars override any value here
# (see autogram/config.py for the AUTOGRAM_* override scheme).
# Credentials live in the environment / .env, never here.
# ---------------------------------------------------------------------------

# The single source of truth for editorial direction. Change active_profile to
# switch the entire content mode; all functional pipeline settings stay shared.
content:
  active_profile: "romance"
  profiles:
    romance:
      theme: "high-quality, photorealistic romantic images of couples deeply in love, with expressive faces, natural emotion, cinematic lighting, beautiful backgrounds, and professional photography aesthetics"
      system_prompt: "You are an art director generating a single creative brief for one photorealistic image of a romantic South Asian couple."
      subject_instruction: "Produce one fresh, specific, visually concrete brief featuring the couple in the described location."
      prompt_anchor: "the same recognizable romantic couple: a mid-20s South Asian woman with warm olive skin, soft almond dark-brown eyes, high cheekbones, full lips, long wavy jet-black side-swept hair and a small red bindi; and a late-20s South Asian man with wheatish-tan skin, deep-set dark-brown eyes, a defined square jawline, short groomed dark beard and thick black hair; both fully clothed in elegant modest attire"
      visual:
        interaction_styles: ["walking hand-in-hand", "gazing into each other's eyes", "intimate embrace", "laughing while walking", "quiet contemplation side-by-side"]
        moods_and_emotions: ["tender and romantic", "playful and joyful", "peaceful and serene", "nostalgic and reflective"]
        photography_trends:
          compositions: ["rule of thirds", "leading lines", "environmental storytelling", "layered foreground, middle ground and background"]
          lighting_styles: ["golden hour warm backlighting", "soft overcast daylight", "dramatic side lighting", "cool blue hour"]
          color_grading: ["warm earthy tones with muted saturation", "vintage film aesthetic", "moody dark romantic grading"]
          depth_of_field: ["deep focus with the environment readable", "moderate depth of field", "selective focus"]
        locations:
          nature:
            - {name: "Alpine meadow with wildflowers", description: "Expansive alpine meadow with wildflowers, distant snow-capped peaks and mist", lighting: "Golden hour sunlight", mood: "serene, adventurous, intimate"}
            - {name: "Tropical beach at golden hour", description: "White sand beach, turquoise ocean, palm trees and an expansive golden sky", lighting: "Warm golden hour sunlight", mood: "romantic, carefree, tropical"}
            - {name: "Misty forest morning", description: "Long forest path fading into atmospheric mist beneath tall trees", lighting: "Soft diffused dawn light", mood: "dreamlike and intimate"}
          city:
            - {name: "Rain-soaked city street", description: "Wet urban street with neon reflections, storefronts and blurred city lights", lighting: "Cool neon mixed with warm city light", mood: "romantic, moody, cinematic"}
            - {name: "Indian palace courtyard", description: "Ornate palace courtyard with tile work, marble arches and fountains", lighting: "Golden hour light", mood: "regal, elegant, heritage"}
    ai_tools:
      theme: "clear, useful editorial content about AI tools, workflows, and practical productivity"
      system_prompt: "You are an editorial art director for an approachable AI-tools publication."
      subject_instruction: "Create a concrete, useful visual story about a specific AI workflow, feature, comparison, or productivity moment; avoid hype and unreadable text in the image."
      prompt_anchor: "clean modern editorial technology illustration, no logos, no readable interface text"
      visual:
        moods_and_emotions: ["clear and confident", "curious and optimistic", "focused and practical"]
        photography_trends: {compositions: ["clean grid composition", "desktop workflow scene", "human-and-tool collaboration"], lighting_styles: ["soft studio light", "calm daylight"], color_grading: ["clean neutral palette with one electric accent", "modern blue and violet palette"], depth_of_field: ["crisp editorial detail", "moderate depth of field"]}
        locations: {workflows: [{name: "Focused creator workspace", description: "A tidy desk with a laptop, notebook and abstract AI workflow visuals", lighting: "Soft window light", mood: "focused and practical"}, {name: "Collaborative product studio", description: "A modern creative studio discussing an abstract AI workflow board", lighting: "Balanced editorial lighting", mood: "curious and productive"}]}
    psychology:
      theme: "thoughtful, evidence-aware visual content about psychology, habits, emotions, and self-understanding"
      system_prompt: "You are an editorial art director for a compassionate psychology publication."
      subject_instruction: "Create a grounded, respectful visual story about an everyday psychological concept, habit, emotion, or reflection; never imply diagnosis or medical advice."
      prompt_anchor: "warm human-centered editorial photograph, diverse adult subjects, respectful natural expressions"
      visual:
        moods_and_emotions: ["reflective and calm", "hopeful", "grounded and compassionate"]
        photography_trends: {compositions: ["quiet observational scene", "symbolic everyday still life", "environmental portrait with negative space"], lighting_styles: ["soft morning light", "gentle overcast daylight", "warm reading-lamp light"], color_grading: ["muted calming earth tones", "soft natural documentary color"], depth_of_field: ["moderate depth of field", "deep focus with environmental context"]}
        locations: {everyday: [{name: "Quiet reading nook", description: "A comfortable reading nook with journal, tea and soft natural light", lighting: "Soft morning light", mood: "reflective and calm"}, {name: "Peaceful park walk", description: "A leafy city park path with a person taking a thoughtful walk", lighting: "Gentle overcast daylight", mood: "grounded and hopeful"}]}
# Deterministic-variation salt. Change it to reshuffle the axis-hint stream
# without changing the theme.
seed_salt: "autogram-v1"

brief:
  history_depth: 30          # how many past briefs to feed the LLM for divergence
  dedupe_threshold: 85       # rapidfuzz token_set_ratio above which a brief is a dup
  max_retries: 3             # reject-and-retry attempts for near-duplicate subjects
  # Axis hints pre-selected by a seeded RNG and injected into the LLM prompt.
  axes:
    camera_angle: ["eye-level", "low angle", "high angle", "dutch angle", "overhead flat-lay", "worm's-eye"]
    season: ["spring", "summer", "autumn", "winter"]
    focal_length: ["16mm wide", "35mm", "50mm", "85mm portrait", "135mm telephoto", "macro"]
    subject_scale: ["extreme close-up", "close-up", "medium shot", "wide establishing shot"]

llm:
  # Ollama runtime. The daemon lifecycle is managed by autogram itself.
  host_env: "OLLAMA_HOST"                  # env var to read; default in code
  model: "qwen2.5:3b-instruct"             # ~2 GB, comfortable on a 4-core CPU runner
  hq_model: "qwen2.5:7b-instruct"          # used only when a GPU is detected
  ready_timeout_s: 120                      # health-poll budget after spawning serve
  request_timeout_s: 180
  temperature: 0.8
  max_retries: 3                            # JSON-validation retries before template fallback

image:
  # CPU default. See README runtime/disk table for alternatives.
  # Photoreal SD1.5 checkpoint (diffusers format) — the realism ceiling on a
  # free CPU runner. ~20-30 steps at 512 takes a few minutes on 4 vCPU but fits
  # the 60-min job budget. For a fast (but plasticky) fallback set model to
  # "stabilityai/sd-turbo" — the code auto-detects "turbo"/"lcm" and switches to
  # the hq_steps/hq_guidance below. Other good CPU options: "Lykon/absolute-reality-1.81".
  model: "Lykon/dreamshaper-8"
  hq_model: "black-forest-labs/FLUX.1-schnell"  # used automatically when CUDA is present
  steps: 26                                 # photoreal SD1.5 wants ~20-30 steps
  guidance_scale: 6.5                       # real CFG (turbo/FLUX use the hq_* values)
  hq_steps: 4                               # FLUX schnell / turbo: distilled, 4 steps
  hq_guidance_scale: 0.0                    # FLUX schnell / turbo want CFG 0.0
  width: 512                                # native 4:5 (IG portrait) — no crop waste
  height: 640                               # 640x800 is sharper but slower on CPU
  # Quality levers for the SD1.5 CPU path (ignored on FLUX/GPU):
  scheduler: "dpmpp_karras"                 # DPM++ 2M Karras: sharper, same steps ("" = default)
  vae: "stabilityai/sd-vae-ft-mse"          # crisper detail + color ("" to disable)
  # Hi-res fix = a 2nd img2img pass that adds real detail (biggest SD1.5 lever)
  # but ~2x time per image. OFF by default so a 4-scene reel fits the 60-min job;
  # turn it on and drop reel.num_scenes to ~2 for maximum quality.
  hires_fix: false
  hires_scale: 1.5
  hires_denoise: 0.4
  hires_steps: 16
  # SD prompt templates. {framing} (shot distance/angle/alignment/candid) leads
  # so distance & composition actually vary; {characters} is the fixed couple
  # (kept identical every run); the brief supplies the rotating scene/place.
  # No fixed focal length here — it biased every frame toward a portrait.
  positive_template: "{framing}, candid photograph of {characters}, {interaction}, {subject}, in {setting}, {lighting}, {mood}, {color_palette}, {time_of_day}, {style_modifiers}, shot on DSLR, natural skin texture, realistic, highly detailed, sharp focus, professional photography, 8k"
  negative_template: "illustration, painting, drawing, cartoon, anime, 3d render, cgi, plastic skin, deformed, disfigured, mutated hands, extra fingers, extra limbs, bad anatomy, lowres, blurry, text, watermark, signature, jpeg artifacts, oversaturated, ugly, deformed face, distorted face, asymmetric face, extra faces, extra heads, fused faces, malformed face, blurry face, disfigured eyes, nudity, nsfw, revealing clothing, cleavage, lingerie, bikini, swimwear"

postproc:
  aspect: "4:5"                # one of: "1:1", "4:5", "1.91:1"
  jpeg_quality: 92
  unsharp_radius: 1.2
  unsharp_percent: 80
  unsharp_threshold: 3
  max_bytes: 8388608           # 8 MB Instagram hard limit

caption:
  tone: "calm, warm, understated; speaks to design lovers"
  emoji_budget: 2              # max emoji in the caption (0 to disable)
  max_length: 2200            # caption + hashtag block hard cap (Instagram)
  hashtag_placement: "caption"  # "caption" or "comment"

hashtags:
  min_count: 12
  max_count: 18               # hard-capped at 30 in code regardless
  # Target tier mix (fractions, validated in code with tolerance).
  tier_broad: 0.30            # >1M posts
  tier_mid: 0.50
  tier_niche: 0.20
  brand_tags: ["autogram", "slowdesign"]   # always appended, normalized

gates:
  nsfw: true
  degenerate: true
  profanity: true
  # Degenerate-image thresholds (on 0-255 grayscale).
  degenerate_min_variance: 60.0   # reject near-uniform output
  degenerate_dark_mean: 12.0      # reject near-black
  degenerate_bright_mean: 243.0   # reject near-white

reel:
  enabled: true
  # Generate 4 scenes. The first scene is already generated by the
  # normal pipeline, so this means 4 total images per Reel.
  num_scenes: 4
  # Average duration of each scene.
  seconds_per_image: 3.2
  # Shorter transitions feel more modern for Instagram.
  crossfade_s: 0.35
  fps: 30
  width: 1080
  height: 1920
  # Used by the FFmpeg fallback renderer.
  zoom: 1.12
  # Put CC0 / royalty-free music here.
  audio_dir: "assets/audio"

  # ------------------------------------------------------------------
  # AI image-to-video
  # ------------------------------------------------------------------

  ai_video:
    enabled: true
    # "auto" = try AI video, then automatically fall back to FFmpeg.
    # "off"  = never call an external AI video provider.
    mode: "auto"
    # Provider: "pixverse" (paid API; needs PIXVERSE_API_KEY + a public image
    # host) or "huggingface" (free serverless tier; needs HF_TOKEN, POSTs the
    # image directly — no hosting; set HF_VIDEO_MODEL to a currently-served
    # image-to-video model). Either way, failure falls back to the FFmpeg reel.
    provider: "huggingface"
    # Only animate selected scenes.
    # Example: [0, 2] means scene 1 and scene 3 become AI video.
    # Other scenes use the free FFmpeg animation.
    ai_scene_indexes: [0, 2]
    # 3 seconds is enough for an AI motion shot and saves credits.
    duration_s: 3
    # Don't wait forever if an external service gets stuck.
    timeout_s: 180
    # Number of polling attempts.
    poll_interval_s: 5
    # If true, failure of AI video NEVER fails the Reel.
    fallback_to_ffmpeg: true
    # Keep generated AI clips temporary.
    keep_intermediate: false

youtube:
  # Keep initial uploads private until you confirm your channel workflow.
  privacy_status: "private"  # private, unlisted, or public
  category_id: "22"          # People & Blogs
state:
  history_path: "state/history.json"
  session_path: "state/ig_session.json"   # instagrapi session settings (gitignored)
  out_dir: "out"