# ---------------------------------------------------------------------------
# AUTOGRAM CONFIGURATION
#
# Non-secret configuration only.
# Environment variables override values here.
#
# Examples:
#   AUTOGRAM_CONTENT__ACTIVE_PROFILE=romance
#   AUTOGRAM_ROMANCE__THIRD_PERSON_PROBABILITY=0.60
#   AUTOGRAM_IMAGE__STEPS=26
#
# Credentials live in .env / GitHub Actions secrets.
# ---------------------------------------------------------------------------


# ---------------------------------------------------------------------------
# Editorial content
# ---------------------------------------------------------------------------

theme: >
  high-quality photorealistic cinematic Indian romance centered on dramatic
  marriage proposals between the same recurring couple, with crystal-clear
  expressive faces, natural emotions, realistic skin, realistic anatomy,
  engagement rings, flowers, emotional reactions, beautiful locations,
  cinematic lighting and professional photography aesthetics.

seed_salt: "autogram-romance-v2"


content:

  # The active profile controls the entire creative direction.
  active_profile: "romance"

  profiles:

    romance:

      theme: >
        photorealistic cinematic Indian romance centered on dramatic marriage
        proposals between the same recurring couple, emotional love stories,
        meaningful gestures, beautiful locations, expressive faces, realistic
        skin, cinematic lighting, flowers, engagement rings and heartfelt
        romantic storytelling.

      system_prompt: >
        You are the creative director for a photorealistic romantic
        photography account. Create specific, visually obvious scenes featuring
        the same recurring couple. The scene must communicate a clear physical
        action rather than a generic description of love. Follow the supplied
        proposal direction exactly. Prioritize realistic human anatomy,
        natural facial expressions, clear faces, believable body language,
        cinematic composition and emotionally powerful storytelling.

      subject_instruction: >
        Create one specific cinematic marriage-proposal scene. The physical
        proposal action must be obvious from the image. The pre-selected
        proposal direction is mandatory. Avoid generic standing couple
        portraits, generic kissing scenes or vague descriptions of romance.
        Make every scene visually distinct from previous scenes.

      # This is kept as a stable anchor for the recurring couple.
      # If you already have a stronger couple descriptor, replace this value
      # with it without changing the rest of the configuration.
      prompt_anchor: >
        the same recurring adult romantic couple, consistent facial identity
        across scenes, photorealistic attractive adult man and adult woman,
        natural realistic skin, expressive eyes, realistic hair and believable
        human anatomy

      visual:

        # These are additional descriptors used by brief.py when constructing
        # the LLM prompt.
        interaction_styles:
          - >
            deeply emotional marriage proposal with intimate eye contact
          - >
            heartfelt proposal with genuine surprise and romantic anticipation
          - >
            emotional kneeling proposal with expressive body language
          - >
            cinematic proposal moment with authentic human reactions
          - >
            dramatic romantic proposal with meaningful eye contact
          - >
            tender proposal with flowers and visible engagement ring

        moods_and_emotions:
          - >
            deeply romantic and emotionally intense
          - >
            heartfelt anticipation and joyful surprise
          - >
            emotional vulnerability and sincere love
          - >
            dramatic romantic tension
          - >
            overwhelming happiness and emotional tears
          - >
            tender anticipation with cinematic emotion
          - >
            bittersweet romantic emotion

        locations:

          romantic:
            - name: "sunset beach"
              description: >
                quiet beach with soft waves, warm horizon and open romantic
                space
              lighting: >
                warm golden-hour sunlight with soft rim light
              mood: >
                expansive, intimate and cinematic

            - name: "flower garden"
              description: >
                lush romantic garden filled with flowers, pathways and
                natural greenery
              lighting: >
                soft golden sunlight filtered through foliage
              mood: >
                dreamy, intimate and joyful

            - name: "rooftop at sunset"
              description: >
                elegant rooftop overlooking a glowing city skyline
              lighting: >
                warm sunset backlight with subtle city lights
              mood: >
                grand, intimate and cinematic

            - name: "mountain viewpoint"
              description: >
                scenic mountain overlook with dramatic landscape and distant
                valleys
              lighting: >
                golden-hour sunlight with atmospheric haze
              mood: >
                grand, emotional and breathtaking

            - name: "luxury hotel garden"
              description: >
                elegant landscaped hotel garden with fountains, flowers and
                warm architectural lighting
              lighting: >
                warm evening illumination with soft practical lights
              mood: >
                luxurious, romantic and sophisticated

            - name: "rainy city street"
              description: >
                romantic city street after rain with reflections on wet
                pavement and glowing lights
              lighting: >
                warm street lights mixed with cool evening ambience
              mood: >
                cinematic, intimate and emotional

            - name: "lakeside promenade"
              description: >
                peaceful lakeside walkway with trees, water reflections and
                distant lights
              lighting: >
                soft sunset light transitioning into blue hour
              mood: >
                calm, intimate and deeply romantic

            - name: "old palace courtyard"
              description: >
                ornate heritage courtyard with arches, stone architecture
                and decorative gardens
              lighting: >
                warm evening architectural lighting
              mood: >
                grand, timeless and cinematic


          indoor:
            - name: "elegant candlelit restaurant"
              description: >
                intimate upscale restaurant table surrounded by candles,
                flowers and warm architectural details
              lighting: >
                soft candlelight mixed with warm ambient illumination
              mood: >
                intimate, luxurious and emotional

            - name: "romantic hotel suite"
              description: >
                elegant hotel interior with flowers, warm lamps and refined
                romantic decor
              lighting: >
                soft warm practical lighting
              mood: >
                private, intimate and sophisticated

            - name: "grand ballroom"
              description: >
                elegant ballroom with chandeliers, polished floors and
                romantic floral arrangements
              lighting: >
                dramatic chandelier lighting with warm highlights
              mood: >
                grand, luxurious and cinematic


        photography_trends:

          compositions:
            - >
              cinematic rule-of-thirds composition with strong foreground
              depth
            - >
              intimate layered composition with foreground flowers
            - >
              asymmetric composition with the proposal action as the focal
              point
            - >
              dramatic environmental composition with cinematic depth
            - >
              shallow-depth romantic portrait composition
            - >
              strong leading lines directing attention toward the proposer

          lighting_styles:
            - >
              warm golden-hour backlight
            - >
              soft cinematic sunset light
            - >
              dramatic warm practical lighting
            - >
              soft diffused romantic light
            - >
              golden rim light with gentle shadows
            - >
              cinematic blue-hour ambience with warm highlights

          color_grading:
            - >
              warm cinematic gold and amber tones
            - >
              rich romantic reds with warm skin tones
            - >
              soft pastel romantic grading
            - >
              cinematic teal-and-warm contrast
            - >
              warm golden filmic tones
            - >
              natural filmic colors with subtle romantic warmth

          depth_of_field:
            - >
              shallow depth of field with faces sharply focused
            - >
              cinematic background separation
            - >
              moderate depth of field keeping the proposal action readable
            - >
              soft bokeh behind the couple
            - >
              environmental depth with clear subjects


# ---------------------------------------------------------------------------
# Romance scene controls
# ---------------------------------------------------------------------------

romance:

  enabled: true

  # Both directions are deliberately enabled.
  # The seeded RNG chooses one per generated scene.
  proposal_directions:
    - "boy_proposes_to_girl"
    - "girl_proposes_to_boy"

  # Approximately 45% of scenes include the third woman.
  third_person_probability: 0.45

  # Make the physical proposal action explicit.
  require_kneeling: true
  require_flowers: true
  require_ring: true

  # Specific ring style requested.
  ring_style: >
    a clearly visible elegant marquise-cut engagement ring

  # Third woman is a genuine love-triangle character, not a random extra.
  third_person_role: >
    a heartbroken woman in unrequited love for the boy

  third_person_emotion: >
    crying, quietly sobbing, tears visibly running down her cheeks,
    heartbroken but not hostile

  cinematic_style: >
    grand cinematic Indian romantic-film atmosphere, emotionally expressive
    faces, dramatic romantic lighting, heartfelt Bollywood-style visual
    storytelling, photorealistic, realistic human anatomy, natural skin


# ---------------------------------------------------------------------------
# Brief generation
# ---------------------------------------------------------------------------

brief:

  history_depth: 30

  dedupe_threshold: 85

  max_retries: 3

  axes:

    camera_angle:
      - "eye-level"
      - "low angle"
      - "high angle"
      - "slight dutch angle"
      - "side profile"
      - "three-quarter angle"

    season:
      - "spring"
      - "summer"
      - "autumn"
      - "winter"

    focal_length:
      - "35mm"
      - "50mm"
      - "85mm portrait"
      - "105mm"
      - "135mm telephoto"

    subject_scale:
      - "medium shot"
      - "three-quarter shot"
      - "full-body shot"
      - "medium-wide shot"


# ---------------------------------------------------------------------------
# Ollama
# ---------------------------------------------------------------------------

llm:

  host_env: "OLLAMA_HOST"

  model: "qwen2.5:3b-instruct"

  hq_model: "qwen2.5:7b-instruct"

  ready_timeout_s: 120

  request_timeout_s: 180

  temperature: 0.8

  max_retries: 3


# ---------------------------------------------------------------------------
# Image generation
# ---------------------------------------------------------------------------

image:

  model: "Lykon/dreamshaper-8"

  hq_model: "black-forest-labs/FLUX.1-schnell"

  # DreamShaper SD1.5 photorealistic path.
  steps: 26

  guidance_scale: 6.5

  # FLUX/turbo path.
  hq_steps: 4

  hq_guidance_scale: 0.0

  width: 512

  height: 512

  # Quality levers for the SD1.5 CPU path (ignored on the FLUX/GPU path).
  scheduler: "dpmpp_karras"          # DPM++ 2M Karras: sharper ("" = model default)
  vae: "stabilityai/sd-vae-ft-mse"   # crisper detail + colour ("" to disable)
  hires_fix: false                   # 2nd img2img pass; ~2x time — turn on for max quality
  hires_scale: 1.5
  hires_denoise: 0.4
  hires_steps: 16

  positive_template: >
    {framing},
    photorealistic cinematic romantic photograph of {characters},
    {interaction},
    {subject},
    in {setting},
    {lighting},
    {mood},
    {composition},
    {color_palette},
    {time_of_day},
    {style_modifiers},
    natural skin texture,
    realistic human anatomy,
    realistic facial features,
    expressive eyes,
    realistic hands,
    realistic clothing,
    highly detailed,
    sharp focus,
    professional DSLR photography,
    cinematic depth,
    natural lighting,
    8k

  negative_template: >
    illustration,
    painting,
    drawing,
    cartoon,
    anime,
    3d render,
    cgi,
    plastic skin,
    deformed,
    disfigured,
    mutated hands,
    extra fingers,
    missing fingers,
    extra limbs,
    bad anatomy,
    lowres,
    blurry,
    text,
    watermark,
    signature,
    jpeg artifacts,
    oversaturated,
    ugly,
    deformed face,
    distorted face,
    asymmetric face,
    extra faces,
    extra heads,
    fused faces,
    malformed face,
    blurry face,
    disfigured eyes,
    duplicate person,
    duplicate couple,
    duplicate girl,
    duplicate boy,
    wrong proposal direction,
    boy and girl both kneeling,
    generic standing couple,
    missing ring,
    missing flowers,
    malformed ring,
    distorted ring,
    extra ring,
    nudity,
    nsfw,
    revealing clothing,
    cleavage,
    lingerie,
    bikini,
    swimwear


# ---------------------------------------------------------------------------
# Post-processing
# ---------------------------------------------------------------------------

postproc:

  aspect: "4:5"

  jpeg_quality: 92

  unsharp_radius: 1.2

  unsharp_percent: 80

  unsharp_threshold: 3

  max_bytes: 8388608


# ---------------------------------------------------------------------------
# Captions
# ---------------------------------------------------------------------------

caption:

  tone: >
    warm, romantic, cinematic, emotionally expressive, understated

  emoji_budget: 2

  max_length: 2200

  hashtag_placement: "caption"


# ---------------------------------------------------------------------------
# Hashtags
# ---------------------------------------------------------------------------

hashtags:

  min_count: 12

  max_count: 18

  tier_broad: 0.30

  tier_mid: 0.50

  tier_niche: 0.20

  brand_tags:
    - "autogram"
    - "romanticphotography"


# ---------------------------------------------------------------------------
# Safety / quality gates
# ---------------------------------------------------------------------------

gates:

  nsfw: true

  degenerate: true

  profanity: true

  degenerate_min_variance: 60.0

  degenerate_dark_mean: 12.0

  degenerate_bright_mean: 243.0


# ---------------------------------------------------------------------------
# Reel generation
# ---------------------------------------------------------------------------

reel:

  enabled: true

  num_scenes: 4

  seconds_per_image: 3.2

  crossfade_s: 0.35

  fps: 30

  width: 1080

  height: 1920

  zoom: 1.12

  audio_dir: "assets/audio"

  ai_video:

    enabled: true

    mode: "auto"

    provider: "huggingface"

    # Scene 1 and scene 3 receive AI image-to-video attempts.
    # Remaining scenes use FFmpeg animation.
    ai_scene_indexes:
      - 0
      - 2

    duration_s: 3

    timeout_s: 180

    poll_interval_s: 5

    fallback_to_ffmpeg: true

    keep_intermediate: false


# ---------------------------------------------------------------------------
# Persistent state
# ---------------------------------------------------------------------------

state:

  history_path: "state/history.json"

  session_path: "state/ig_session.json"

  out_dir: "out"


# ---------------------------------------------------------------------------
# Carousel (multi-image album) generation
# ---------------------------------------------------------------------------

carousel:

  enabled: true

  # Instagram allows 2-10 slides; each slide is a distinct scene of the couple.
  num_slides: 4


# ---------------------------------------------------------------------------
# Content mix
#
# When a run does not force a content type (--content-type), one is picked at
# random per run using these weights. Weight 0 disables a type. Override per
# account under `accounts:` below.
# ---------------------------------------------------------------------------

content_mix:
  reel: 3
  carousel: 1
  photo: 1


# ---------------------------------------------------------------------------
# YouTube Shorts (only used when an account's backend is "youtube")
# ---------------------------------------------------------------------------

youtube:
  privacy_status: "private"     # private | unlisted | public
  category_id: "22"             # 22 = People & Blogs


# ---------------------------------------------------------------------------
# Linked accounts
#
# One repo can now drive several Instagram/YouTube accounts. Each account picks
# a content profile and a content mix; its CREDENTIALS are supplied by the single
# `AUTOGRAM_ACCOUNTS` secret (a JSON array matched to these entries by `id`) so
# the flat IG_*/YOUTUBE_* env-var names never collide. Example secret:
#
#   AUTOGRAM_ACCOUNTS='[{"id":"romance","ig_username":"..","ig_session_b64":".."},
#                       {"id":"shorts","youtube_client_id":"..","youtube_client_secret":"..","youtube_refresh_token":".."}]'
#
# Leave this list empty to keep the classic single-account behaviour (creds come
# from the flat IG_*/YOUTUBE_* env vars, history in state/history.json).
# ---------------------------------------------------------------------------

accounts: []
  # - id: romance
  #   platform: instagram        # instagram | youtube
  #   backend: instagrapi        # instagrapi | graph | youtube ("" -> derived)
  #   profile: romance           # a key under content.profiles
  #   enabled: true
  #   content_mix: { reel: 3, carousel: 1, photo: 1 }
  #   audio_dir: "assets/audio"
  # - id: shorts
  #   platform: youtube
  #   profile: romance
  #   content_mix: { reel: 1 }   # YouTube needs a video
