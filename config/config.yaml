accounts:
  - id: romance_account
    platform: instagram        # instagram | youtube
    backend: graph        # instagrapi | graph | youtube ("" -> derived)
    profile: romance      # Which content profile to use
    enabled: true
    content_mix:
      reel: 3
      carousel: 1
      photo: 1
    audio_dir: "assets/audio"

  - id: ai_tools_account
    platform: instagram
    backend: graph
    profile: ai_tools     # Separate AI Tools profile
    enabled: true        # Enabled to run together with romance
    content_mix:
      reel: 4
      carousel: 0
      photo: 1
    audio_dir: "assets/audio"
