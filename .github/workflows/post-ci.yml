name: autogram-post

# cron is UTC — GitHub Actions has no timezone support. IST = UTC+5:30, so the
# IST equivalent of each slot is noted inline. GitHub also DELAYS and sometimes
# DROPS the `schedule` event under load (observed gaps of 51-213 min on an
# hourly cron), so treat these as approximate, never as exact minutes.
on:
  schedule:
    - cron: "37 */2 * * *"    # **.07 every other hour

  workflow_dispatch:
    inputs:
      slot:
        description: "Posting slot"
        required: false
        default: "manual"
        type: string
      dry_run:
        description: "Generate + gate, do not publish"
        required: false
        default: false
        type: boolean
      description:
        description: "Override the content theme"
        required: false
        default: ""
        type: string
      seed:
        description: "Reproducible seed"
        required: false
        default: ""
        type: string

# Declaring `permissions:` at all drops every default scope, so `issues: write`
# must be listed explicitly — the failure-issue step below shells out to
# `gh issue create/comment` and 403s without it.
permissions:
  contents: write
  issues: write

# Stops two slots (or schedule-vs-dispatch) from posting simultaneously and
# from racing each other on state/history.json. cancel-in-progress: false means
# the later slot queues behind the running one rather than being cancelled.
concurrency:
  group: autogram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      OLLAMA_MODELS: ${{ github.workspace }}/.cache/ollama/models
      OLLAMA_HOST: http://127.0.0.1:11434
      # Secrets -> env. Two logical inputs: IG creds + the theme (config).
      POST_BACKEND: ${{ secrets.POST_BACKEND }}
      IG_USERNAME: ${{ secrets.IG_USERNAME }}
      IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
      IG_SESSION_B64: ${{ secrets.IG_SESSION_B64 }}
      IG_PROXY: ${{ secrets.IG_PROXY }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      # Required by autogram.image_host to upload media to GitHub Releases.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      # Optional: free-tier AI image-to-video (PixVerse). If unset, the run
      # falls back to the FFmpeg Ken-Burns reel automatically.
      PIXVERSE_API_KEY: ${{ secrets.PIXVERSE_API_KEY }}
      PIXVERSE_MODEL: ${{ secrets.PIXVERSE_MODEL }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_VIDEO_MODEL: ${{ secrets.HF_VIDEO_MODEL }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the "Commit history back" step rebases onto
          # origin/<branch>, which a default depth-1 shallow clone cannot do.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Cache model weights and pip. Note: repo cache ceiling is 10 GB and
      # entries evict after 7 days of no use (see README).
      - name: Cache HuggingFace + Ollama models
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.cache/huggingface
            ${{ github.workspace }}/.cache/ollama/models
          key: models-${{ runner.os }}-${{ hashFiles('config/config.yaml') }}
          restore-keys: |
            models-${{ runner.os }}-

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements*.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Ensure ffmpeg (Reel assembly + clip upload)
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1

      - name: Install and warm Ollama
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          mkdir -p "$OLLAMA_MODELS"
          # autogram manages the daemon itself, but warm it here so the model
          # pull is cached in this step's logs and the daemon is proven healthy.
          OLLAMA_HOST=127.0.0.1:11434 nohup ollama serve >/tmp/ollama.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 2
          done
          ollama pull qwen2.5:3b-instruct

      - name: Install Python deps (CPU torch)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements-cpu.txt
          pip install -e .

      - name: Run autogram
        id: run
        env:
          # Dispatch inputs arrive via env, never string-interpolated into the
          # shell (the old `eval ... ${{ inputs.description }}` was injectable).
          IN_DRY_RUN: ${{ inputs.dry_run }}
          IN_DESCRIPTION: ${{ inputs.description }}
          IN_SEED: ${{ inputs.seed }}
          IN_SLOT: ${{ inputs.slot }}
          SCHED_CRON: ${{ github.event.schedule }}
        run: |
          # Deliberately NOT `set -e`: the `[ ... ] && ARGS+=(...)` lines below
          # return 1 when the input is empty, which would abort the step.
          set -uo pipefail
          echo "slot=${IN_SLOT:-} cron=${SCHED_CRON:-none}"
          ARGS=()
          [ "${IN_DRY_RUN:-false}" = "true" ] && ARGS+=(--dry-run)
          [ -n "${IN_DESCRIPTION:-}" ] && ARGS+=(--description "$IN_DESCRIPTION")
          [ -n "${IN_SEED:-}" ] && ARGS+=(--seed "$IN_SEED")
          python -m autogram.run "${ARGS[@]}" 2>&1 | tee run.log
          code=${PIPESTATUS[0]}
          # Exit codes: 0 ok, 1 config, 2 brief/LLM, 3 image, 4 postproc,
          # 5 caption, 6 safety gate, 7 publish, 8 duplicate.
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "autogram exit code: $code" >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Upload artifacts (image + caption)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autogram-post-${{ github.run_id }}
          path: |
            out/*.jpg
            out/*.txt
            out/*.json
            run.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit history back
        if: success()
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- state/history.json)" ]; then
            echo "no history change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f state/history.json
          git commit -m "chore(autogram): record run [skip ci]"
          # A 10-55 minute run means origin/<branch> has very likely moved on,
          # and a bare `git push` is then rejected non-fast-forward — which was
          # marking successful posts as failed runs and losing history records.
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "pushed on attempt $attempt"; exit 0
            fi
            echo "push rejected, rebasing (attempt $attempt)"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}" || { git rebase --abort; exit 1; }
            sleep $((attempt * 5))
          done
          echo "could not push history after 5 attempts"; exit 1

      - name: Open/append failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXIT_CODE: ${{ steps.run.outputs.exit_code }}
          SCHED_CRON: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          TAIL=$(tail -n 60 run.log 2>/dev/null || echo "no log captured")
          TITLE="autogram run failed"
          # shellcheck disable=SC2016 # single quotes are the printf format string
          BODY=$(printf '### Run failed\nRun: %s\nExit code: %s\nSlot cron: %s\n\n```\n%s\n```\n' \
                 "${GITHUB_RUN_ID}" "${EXIT_CODE:-unknown}" "${SCHED_CRON:-dispatch}" "$TAIL")
          # `.[0].number` emits the literal string "null" on no match, which
          # then becomes `gh issue comment null`. `// empty` yields "" instead.
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" \
                       --json number --jq '.[0].number // empty' || echo "")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label autogram || \
              gh issue create --title "$TITLE" --body "$BODY"
          fi